<!DOCTYPE html>
<html>
<body>
    <input type="text" id="userInput" placeholder="Ask Nexus AI...">
    <button onclick="getNexus()">Send</button>
    <div id="response"></div>

    <script>
        async function getNexus() {
            const input = document.getElementById('userInput').value;
            // API link එකට /api/chat දාපන්. 
            const res = await fetch(`/api/chat?prompt=${encodeURIComponent(input)}`);
            const data = await res.json();
            document.getElementById('response').innerText = data.reply || data.error;
        }
    </script>
</body>
</html>
